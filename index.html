<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>このページの異変を見つけてください🙏 ― 答え合わせ</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+1p:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #222;
    --sub: #6b6b6b;
    --line: #e4e4e4;
    --bg: #fff;
    --panel: #f4f4f4;
    --pink: #e6336f;
    --red: #e21e3c;
    --ok: #1f8a4c;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; overflow-anchor: none; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "M PLUS 1p", "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
    line-height: 1.75;
  }
  main { max-width: 760px; margin: 0 auto; padding: 48px 16px 96px; }
  h1 { font-size: 28px; font-weight: 800; margin: 0 0 8px; letter-spacing: .02em; }
  h2 { font-size: 20px; font-weight: 800; margin: 0 0 16px; }
  p { margin: 0 0 16px; }
  .sub { color: var(--sub); font-size: 14px; }
  a { color: var(--pink); }
  button { font: inherit; cursor: pointer; }

  .btn {
    display: inline-block;
    border: 2px solid var(--pink);
    background: #fff;
    color: var(--pink);
    font-weight: 800;
    padding: 12px 28px;
    border-radius: 2px;
    text-decoration: none;
  }
  .btn.primary { background: var(--pink); color: #fff; }
  .btn:disabled { border-color: var(--line); color: #bbb; background: #fafafa; cursor: default; }

  section { display: none; }
  section.on { display: block; }

  /* gate */
  #gate { padding-top: 12vh; }
  #gate .actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 32px; }

  /* questions */
  .q {
    display: grid;
    grid-template-columns: 200px 1fr;
    gap: 16px;
    align-items: center;
    padding: 16px 0;
    border-top: 1px solid var(--line);
  }
  .q:last-of-type { border-bottom: 1px solid var(--line); }
  .q img { width: 100%; display: block; border: 1px solid var(--line); }
  .q .label { font-weight: 800; margin-bottom: 8px; }
  .choice { display: flex; gap: 8px; flex-wrap: wrap; }
  .choice button {
    border: 2px solid var(--line);
    background: #fff;
    color: var(--ink);
    padding: 8px 18px;
    font-weight: 700;
    border-radius: 2px;
  }
  .choice button[aria-pressed="true"] { border-color: var(--pink); background: var(--pink); color: #fff; }
  #submitRow { margin-top: 32px; text-align: center; }

  /* result */
  .score {
    text-align: center;
    padding: 32px 16px;
    background: var(--panel);
    margin-bottom: 32px;
  }
  .score .big { font-size: 56px; font-weight: 800; line-height: 1.2; }
  .score .big small { font-size: 22px; font-weight: 700; }
  .score .msg { margin: 8px 0 24px; }
  .x-share { display: inline-flex; align-items: center; gap: 8px; background: #000; border-color: #000; color: #fff; }
  .comment { display: block; max-width: 420px; margin: 0 auto 16px; text-align: left; }
  .comment span { display: block; font-size: 13px; color: var(--sub); margin-bottom: 4px; }
  .comment input { width: 100%; font: inherit; font-size: 16px; padding: 10px 12px; border: 1px solid #ccc; border-radius: 2px; background: #fff; }
  .comment input:focus { outline: 2px solid var(--pink); outline-offset: -1px; }
  .x-share svg { width: 16px; height: 16px; fill: currentColor; }

  .ans { padding: 24px 0; border-top: 1px solid var(--line); }
  .ans img { width: 100%; height: auto; display: block; border: 1px solid var(--line); margin: 12px 0; }
  .ans .head { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: baseline; }
  .ans .head b { font-size: 18px; }
  .tag { font-size: 13px; font-weight: 700; padding: 2px 10px; border-radius: 999px; border: 1px solid currentColor; }
  .tag.hit { color: var(--ok); }
  .tag.miss { color: var(--red); }
  .truth { font-weight: 700; }
  .closing { margin: 48px 0 0; color: var(--sub); text-align: center; }
  .lap { padding-bottom: 72px; }

  @media (max-width: 560px) {
    main { padding-top: 32px; }
    h1 { font-size: 24px; }
    .q { grid-template-columns: 1fr; }
    .score .big { font-size: 44px; }
  }
</style>
</head>
<body>
<main>

  <!-- 1. 入口：ネタばらし防止 -->
  <section id="gate" class="on" aria-labelledby="gate-title">
    <h1 id="gate-title">答え合わせ</h1>
    <p>ここから先には、答えがあります。</p>
    <p>まだ5枚すべてを判断していないなら、作品ページに戻ってください。</p>
    <div class="actions">
      <a class="btn" id="backLink" href="#">作品ページに戻る</a>
      <button class="btn primary" id="toQuiz" type="button">判断した。答え合わせをする</button>
    </div>
  </section>

  <!-- 2. 回答 -->
  <section id="quiz" aria-labelledby="quiz-title">
    <h1 id="quiz-title">あなたの判断</h1>
    <p class="sub">作品ページで見た5枚の画像について、異変があったかどうかを選んでください。</p>
    <div id="questions"></div>
    <div id="submitRow">
      <button class="btn primary" id="submit" type="button" disabled>答え合わせ</button>
    </div>
  </section>

  <!-- 3. 結果 -->
  <section id="result" aria-labelledby="result-title">
    <h1 id="result-title" class="sr-only" hidden>結果</h1>
    <div class="lap" id="lap1">
      <div class="score">
        <div class="big" data-score></div>
        <p class="msg" data-msg></p>
        <label class="comment"><span>ひとこと感想（なくてもOK）</span><input type="text" data-comment maxlength="40" autocomplete="off"></label>
        <a class="btn x-share" data-share target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
          <span data-share-label>結果をポストする</span>
        </a>
      </div>
      <h2>答え</h2>
      <div data-answers></div>
      <p class="closing" data-closing>答え合わせは以上です。<br>このページには、異変はありませんでしたか。</p>
    </div>
  </section>

</main>
<script>
  // 公開後に自分の作品ページのURLへ差し替える
  const WORK_URL = "https://gameparade.creators-guild.com/works/";

  const ITEMS = [
    { anomaly: true, text: "写真の中のページへ、画面ごとどこまでも落ち続けています。何段落ちても、その先にあるのはまたこのページです。" },
    { anomaly: true, text: "見ている間に、閲覧数が237から238、239とひとつずつ増え、またひとつずつ237へ戻っていきます。写真なのに。" },
    { anomaly: true, text: "しばらくすると、ページの部品が次々に剥がれ落ちて、画面の下に積み重なります。そして逆再生のように、元の場所へ戻っていきます。" },
    { anomaly: true, text: "しばらくすると、右の説明文の3行目に文字入力のカーソルが現れ、「なんか一部の写真が変？」が消されて「さっきからずっと見てますよね？」と打ち込まれます。そしてまた消され、何事もなかったように元の文が打ち直されます。" },
    { anomaly: true, text: "しばらくすると、誰も押していないのに「応援する!!」が「応援済み」になり、応援数が7から8に増えます。少しすると、その応援はそっと取り消されます。" },
  ];
  const MESSAGES = {
    5: "すべて見抜きました。……このページも、ずっとあなたを見ていました。",
    4: "あと1枚。このページは、まだ何か隠しています。",
    3: "半分は見抜けました。残りは、まだ写ったままです。",
    2: "見抜けたのは2枚だけ。このページは、あなたを帰しません。",
    1: "ほとんど気づきませんでしたね。",
    0: "異変なんて、最初からなかったのかもしれません。",
  };

  const answers = new Array(ITEMS.length).fill(null);
  const $ = (id) => document.getElementById(id);
  const show = (id) => {
    document.querySelectorAll("section").forEach((s) => s.classList.toggle("on", s.id === id));
    window.scrollTo(0, 0);
  };

  $("backLink").href = WORK_URL;
  $("toQuiz").addEventListener("click", () => show("quiz"));

  // 回答欄を組み立てる
  const qWrap = $("questions");
  ITEMS.forEach((item, i) => {
    const row = document.createElement("div");
    row.className = "q";
    row.innerHTML = `
      <img src="img/q${i + 1}.jpg" alt="画像${i + 1}">
      <div>
        <div class="label">画像${i + 1}</div>
        <div class="choice" role="group" aria-label="画像${i + 1}の判断">
          <button type="button" data-v="true" aria-pressed="false">異変あり</button>
          <button type="button" data-v="false" aria-pressed="false">異変なし</button>
        </div>
      </div>`;
    row.querySelectorAll("button").forEach((b) => {
      b.addEventListener("click", () => {
        answers[i] = b.dataset.v === "true";
        row.querySelectorAll("button").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
        $("submit").disabled = answers.some((a) => a === null);
      });
    });
    qWrap.append(row);
  });

  // 1周分（点数・答え・最後の一文）の中身を入れる。lap は下から数えて何周目か
  let score = 0;
  let comment = "";
  function shareHref(lap) {
    const n = ITEMS.length;
    const result = score === n ? `${n}枚すべて、見抜いた。` : score === 0 ? "1枚も見抜けなかった。" : `${n}枚中${score}枚、見抜いた。`;
    const tail = lap > 1
      ? `${score > 0 ? "……のに、" : "しかも、"}まだこのページから出られていない。（${lap}周目）`
      : "もう、このページに異変はないはず。";
    const text = ["このページの異変を見つけてください🙏", result, tail].join("\n")
      + (comment.trim() ? "\n\n" + comment.trim() : "")
      + "\n\n#このページの異変 #GC甲子園2026\n";
    return "https://twitter.com/intent/tweet?text=" + encodeURIComponent(text) + "&url=" + encodeURIComponent(WORK_URL);
  }
  // 感想はどの周で書いても、全部の周のポストに入る
  document.addEventListener("input", (e) => {
    if (!e.target.matches("[data-comment]")) return;
    comment = e.target.value;
    document.querySelectorAll(".lap").forEach((el) => {
      const box = el.querySelector("[data-comment]");
      if (box !== e.target) box.value = comment;
      el.querySelector("[data-share]").href = shareHref(Number(el.dataset.lap));
    });
  });
  function lapMessage(lap) {
    if (lap === 1) return MESSAGES[score];
    return LAP_MESSAGES[lap - 2] || `このページを、${lap}回見ています。`;
  }
  function fillLap(el, lap) {
    el.dataset.lap = lap;
    el.querySelector("[data-score]").innerHTML = `${ITEMS.length}枚中 ${score}<small>枚 正解</small>`;
    el.querySelector("[data-msg]").textContent = lapMessage(lap);
    el.querySelector("[data-share]").href = shareHref(lap);
    el.querySelector("[data-comment]").value = comment;
    el.querySelector("[data-share-label]").textContent = lap > 1 ? `${lap}周したことをポストする` : "結果をポストする";
  }

  $("submit").addEventListener("click", () => {
    score = ITEMS.reduce((n, item, i) => n + (item.anomaly === answers[i] ? 1 : 0), 0);
    const lap1 = $("lap1");
    const aWrap = lap1.querySelector("[data-answers]");
    aWrap.innerHTML = "";
    ITEMS.forEach((item, i) => {
      const hit = item.anomaly === answers[i];
      const el = document.createElement("div");
      el.className = "ans";
      el.innerHTML = `
        <div class="head">
          <b>画像${i + 1}</b>
          <span class="truth">${item.anomaly ? "異変あり" : "異変なし"}</span>
          <span class="tag ${hit ? "hit" : "miss"}">${hit ? "正解" : "不正解"}（あなた：${answers[i] ? "異変あり" : "異変なし"}）</span>
        </div>
        <img src="img/a${i + 1}.jpg" alt="画像${i + 1}の答え" width="1272" height="715" loading="lazy">
        <p>${item.text}</p>`;
      aWrap.append(el);
    });
    fillLap(lap1, 1);
    show("result");
    armLastAnomaly();
  });

  // 最後の異変
  //   最後の一文まで読んで上に戻ると、上がない。点数・答え・最後の一文が、上へ上へと終わりなくくり返す。
  //   1周目の終わりが見えた瞬間に、アドレスバーとタブの名前が書き換わる。
  const LAP_MESSAGES = [
    "あれ、さっきも見ましたよね。",
    "このページは、まだ終わりません。",
    "上に戻っても、このページです。",
    "まだ、見てますよね？",
  ];
  const HASH = "#あれ、ループしてる？";
  if (location.hash) history.replaceState(null, "", location.pathname + location.search);

  function armLastAnomaly() {
    const lap1 = $("lap1");
    let top = lap1, armed = false, marked = false, shownLap = 1;
    const inView = (el) => { const r = el.getBoundingClientRect(); return r.bottom > 0 && r.top < window.innerHeight; };

    // いちばん上の周の、さらに上に1周足す（見ている位置は動かさない）
    function addLapAbove() {
      const el = lap1.cloneNode(true);
      el.removeAttribute("id");
      el.querySelectorAll("img").forEach((img) => img.removeAttribute("loading"));
      fillLap(el, Number(top.dataset.lap) + 1);
      const before = document.documentElement.scrollHeight;
      top.before(el);
      window.scrollBy(0, document.documentElement.scrollHeight - before);
      top = el;
    }

    function check() {
      // 1周目の最後の一文が見えて、点数が画面の外にあるうちに仕掛ける
      if (!armed) {
        if (inView(lap1.querySelector("[data-closing]")) && lap1.querySelector(".score").getBoundingClientRect().bottom < 0) {
          armed = true;
          addLapAbove();
        }
        return;
      }
      // 上に近づいたら、さらに1周足す。これで上は終わらない
      if (window.scrollY < window.innerHeight * 2) addLapAbove();
      // 2周目より上の「最後の一文」か点数が見えたら、アドレスバーとタブの名前を書き換える
      for (const el of document.querySelectorAll(".lap")) {
        const lap = Number(el.dataset.lap);
        if (lap < 2 || lap <= shownLap) continue;
        if (inView(el.querySelector("[data-closing]")) || inView(el.querySelector(".score"))) {
          shownLap = lap;
          document.title = `このページを${lap}周しています`;
          if (!marked) {
            marked = true;
            history.replaceState(null, "", location.pathname + location.search + HASH);
          }
        }
      }
    }
    window.addEventListener("scroll", check, { passive: true });
  }
</script>
</body>
</html>
